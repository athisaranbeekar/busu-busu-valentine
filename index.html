<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hey Busu Busu 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }

    /* Floating hearts */
    .hearts span {
      position: fixed;
      bottom: -50px;
      font-size: 26px;
      animation: floatUp 10s linear infinite;
      opacity: 0.9;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 80px 20px;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3.2rem;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      padding: 35px;
      max-width: 520px;
      margin: auto;
      box-shadow: 0 12px 35px rgba(255,0,120,0.4);
      position: relative;
    }

    .question {
      font-family: 'Pacifico', cursive;
      font-size: 1.9rem;
      margin-bottom: 30px;
    }

    .btns {
      position: relative;
      height: 120px;
    }

    .love-btn {
      padding: 12px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      background: #ff4d6d;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,0,100,0.4);
      position: absolute;
      transition: transform 0.2s;
    }

    #yesBtn {
      left: 50%;
      transform: translateX(-120%) scale(1);
    }

    #noBtn {
      left: 50%;
      transform: translateX(20%);
    }

    /* Explosion particles */
    .particle {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      animation: explode 1.5s ease-out forwards;
    }

    @keyframes explode {
      to {
        transform: translate(var(--x), var(--y)) scale(1.5);
        opacity: 0;
      }
    }

    /* Message overlay */
    .message-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,154,158,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }

    .message-card {
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(14px);
      border-radius: 25px;
      padding: 40px;
      max-width: 650px;
      box-shadow: 0 15px 40px rgba(255,0,120,0.4);
      animation: fadeIn 1s ease forwards;
    }

    .message-card h2 {
      font-family: 'Pacifico', cursive;
      font-size: 2.4rem;
      margin-bottom: 20px;
      color: #5a0f2e;
    }

    .message-card p {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      line-height: 1.9;
      letter-spacing: 0.3px;
      word-spacing: 2px;
      color: #7a1f3d;
      text-align: left;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Cursor blink */
    .cursor {
      display: inline-block;
      width: 8px;
      margin-left: 4px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Floating hearts -->
  <div class="hearts">
    <span style="left:5%">💖</span>
    <span style="left:15%">💘</span>
    <span style="left:25%">💗</span>
    <span style="left:35%">💓</span>
    <span style="left:45%">💞</span>
    <span style="left:55%">💝</span>
    <span style="left:65%">❤️</span>
    <span style="left:75%">💖</span>
    <span style="left:85%">💘</span>
    <span style="left:95%">💗</span>
  </div>

  <div class="container">
    <h1>Hey Busu Busu 💕</h1>

    <div class="card">
      <div class="question">
        Will you be my Valentine forever ♾️? 💘
      </div>

      <div class="btns">
        <button id="yesBtn" class="love-btn">YES 💕</button>
        <button id="noBtn" class="love-btn">NO 🙈</button>
      </div>
    </div>
  </div>

  <!-- Final Message -->
  <div class="message-overlay" id="message">
    <div class="message-card">
      <h2>Busu Busu 💖</h2>
      <p id="typedMessage"><span id="cursor" class="cursor">|</span></p>
      <h3 id="finalLine" style="display:none; margin-top:30px; font-family:'Pacifico', cursive; font-size:2rem; color:#5a0f2e;">
        Forever starts here ♾️
      </h3>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2f6c0f6a9b.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const card = document.querySelector(".card");
    const message = document.getElementById("message");
    const typedMessage = document.getElementById("typedMessage");
    const finalLine = document.getElementById("finalLine");
    const cursor = document.getElementById("cursor");
    const bgMusic = document.getElementById("bgMusic");

    let yesScale = 1;

    const fullMessage = `
I know we’ve only known each other for a short while, and how everything between us began was random and completely unexpected.

But the moment I saw you, something deep inside me felt certain — that you were going to be someone truly special.

It wasn’t love at first sight. It felt more like coming home — a sense of calm, comfort, and peace that I didn’t even realize I was looking for.

You mean so much to me, and I’m genuinely excited for everything that lies ahead — our endless conversations, silly quarrels, romance, arguments, missing each other, and all the little moments in between ♾️💞
    `.trim();

    function moveNoBtn() {
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      noBtn.style.left = Math.random() * (cardRect.width - btnRect.width) + "px";
      noBtn.style.top = Math.random() * (cardRect.height - btnRect.height) + "px";

      yesScale += 0.15;
      yesBtn.style.transform = `translateX(-120%) scale(${yesScale})`;
    }

    ["mouseenter", "touchstart", "click"].forEach(event => {
      noBtn.addEventListener(event, (e) => {
        e.preventDefault();
        moveNoBtn();
      });
    });

    yesBtn.addEventListener("click", (e) => {
      bgMusic.volume = 0;
      bgMusic.play();

      let vol = 0;
      const fade = setInterval(() => {
        if (vol < 0.5) {
          vol += 0.02;
          bgMusic.volume = vol;
        } else {
          clearInterval(fade);
        }
      }, 200);

      const emojis = ["💖","💘","💗","💓","💞","✨","🎉"];
      for (let i = 0; i < 40; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = e.clientX + "px";
        p.style.top = e.clientY + "px";
        p.style.setProperty("--x", `${(Math.random()-0.5)*400}px`);
        p.style.setProperty("--y", `${(Math.random()-0.5)*400}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }

      setTimeout(() => {
        message.style.display = "flex";
        typeWriter(fullMessage);
      }, 600);
    });

    function typeWriter(text) {
      let i = 0;
      typedMessage.innerHTML = "";
      cursor.style.display = "inline-block";

      const interval = setInterval(() => {
        typedMessage.innerHTML += text[i] === "\n" ? "<br>" : text[i];
        typedMessage.appendChild(cursor);
        i++;

        if (i >= text.length) {
          clearInterval(interval);
          cursor.style.display = "none";
          setTimeout(() => {
            finalLine.style.display = "block";
          }, 800);
        }
      }, 30);
    }
  </script>

</body>
</html>
