<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Busu Busu 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:'Caveat',cursive;
  color:#4a0e2e;
  overflow:hidden;
}

/* FLOATING HEARTS */
.hearts span{
  position:fixed;
  bottom:-50px;
  font-size:22px;
  animation:float 12s linear infinite;
  opacity:0.7;
  z-index:0;
}

@keyframes float{
  0%{transform:translateY(0);opacity:0;}
  10%{opacity:0.8;}
  100%{transform:translateY(-110vh);opacity:0;}
}

/* COMMON */
.page{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  position:relative;
  z-index:1;
}

.card{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px);
  padding:40px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(255,0,120,0.35);
}

h1{
  font-family:'Pacifico',cursive;
  font-size:3rem;
  margin-bottom:20px;
}

.question{
  font-size:1.6rem;
  margin-bottom:30px;
}

/* BUTTONS */
.btns{
  position:relative;
  height:120px;
}

button{
  padding:12px 32px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  font-size:1.1rem;
  cursor:pointer;
  position:absolute;
}

#yes{left:30%;}
#no{left:55%;}

/* PASSWORD PAGE */
#passwordPage{
  display:none;
  flex-direction:column;
}

input{
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:1.1rem;
  text-align:center;
}

/* LETTER PAGE */
#letterPage{
  display:none;
  height:100vh;
  overflow-y:auto;
  padding:60px 20px;
}

.letter{
  max-width:720px;
  margin:auto;
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(16px);
  padding:50px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(255,0,120,0.35);
}

.letter h2{
  font-family:'Pacifico',cursive;
  font-size:2.6rem;
  margin-bottom:25px;
}

.handwritten{
  font-size:1.6rem;
  line-height:2.2;
  letter-spacing:0.3px;
  white-space:pre-wrap;
}

/* Cursor */
.cursor{
  display:inline-block;
  width:3px;
  height:1.6rem;
  background:#4a0e2e;
  margin-left:4px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* TIMER */
.timer{
  margin-bottom:25px;
  font-size:1.1rem;
  font-style:italic;
}
</style>
</head>

<body>

<!-- HEARTS -->
<div class="hearts">
  <span style="left:5%">💖</span>
  <span style="left:15%">💗</span>
  <span style="left:25%">💓</span>
  <span style="left:35%">💞</span>
  <span style="left:45%">💝</span>
  <span style="left:55%">❤️</span>
  <span style="left:65%">💘</span>
  <span style="left:75%">💖</span>
  <span style="left:85%">💗</span>
  <span style="left:95%">💓</span>
</div>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <div class="card">
    <h1>Hey Busu Busu 💕</h1>
    <div class="question">Will you be my Valentine forever ♾️?</div>
    <div class="btns">
      <button id="yes">YES 💖</button>
      <button id="no">NO 🙈</button>
    </div>
  </div>
</div>

<!-- PASSWORD -->
<div class="page" id="passwordPage">
  <div class="card">
    <h1>Only for you 💗</h1>
    <p>The Date I turned you on and I felt your soft busu busu</p>
    <input type="password" id="password" placeholder="Hint: you already know 😉">
    <br><br>
    <button onclick="checkPassword()">Unlock 💌</button>
  </div>
</div>

<!-- LETTER -->
<div id="letterPage">
  <div class="letter">
    <h2>Busu Busu 💖</h2>
    <div class="timer" id="timer"></div>
    <div class="handwritten" id="text"></div>
  </div>
</div>

<script>
/* RUNAWAY NO */
const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseenter",()=>{
  noBtn.style.left=Math.random()*70+"%";
  noBtn.style.top=Math.random()*70+"%";
});

/* YES */
document.getElementById("yes").onclick=()=>{
  page1.style.display="none";
  passwordPage.style.display="flex";
};

/* PASSWORD */
const SECRET="26012026";

function checkPassword(){
  if(password.value.toLowerCase()===SECRET){
    passwordPage.style.display="none";
    letterPage.style.display="block";
    startTyping();
  } else {
    alert("Try again 💕");
  }
}

/* TYPING EFFECT */
const letterText = `This is my first ever letter to you. And it’s a very special one, because this is the first time I’m doing something like this for someone.
I honestly don’t even know how I’m managing to do all this, or if I’m doing it the “right” way—but I really wanted to do it for you. That’s the only thing I’m sure about.

I don’t know if you’re able to fully accept or believe everything that’s happening right now, or if you’re even in the same space as me. Sometimes I might come across as overwhelming—maybe I talk too much, express too much, or move a little too fast. It might feel like I’m rushing things or unintentionally making you uncomfortable at times. I genuinely don’t know.
But what I do know is this: nothing I’m doing is fake or artificial. Everything comes from a real place, and it’s only for Suba—my one and only Busu Busu.

I’m usually a very private person, especially with my family. They know things, but not the details—not what I truly feel inside. With you, I want to change that. I want to share anything and everything with you. I want you to be my safe place for life, and I promise I’ll be the same for you. 🤍

I know we’ve only known each other for a short while, and how everything between us began was random and completely unexpected. But the moment I saw you, something deep inside me felt certain—that you were going to be someone truly special.

I don’t know if it was love at first sight, but I’m pretty sure it felt like coming home—a sense of calm, comfort, and peace that I didn’t even realize I was looking for.

Sometimes I might get clingy—brace yourself (haha). I’m expressive and energetic, running around here and there, but at times I’m also a very boring person who just wants to sit at home and do nothing. That doesn’t mean I’ve lost interest or stopped loving you—it’s just me.
You always say, “Starting-le ipdi than irukum, apram fade ayidum.” I don’t want you to overthink or confuse this phase whenever I’m just being “boring” 😄

There’s so much in my mind right now. I want to play with you, dance with you, sing with you, fight and argue with you, watch movies, roam the world, visit places, sit idle, listen to music, grow old, learn new things, hug you, kiss you, build a home, cook together, eat together—and the list just goes on.
I want to tick off everything on that bucket list, slowly and steadily, without rushing. You know how I am—this is where I’ll need your help too, to slow me down when I rush ahead.

I’m genuinely excited for everything that lies ahead—our endless conversations, silly quarrels, romance, arguments, missing each other, and all the little moments in between.

I don’t want this letter to be too long, and I don’t want to spill everything all at once.
This letter is for my Busu Busu and * **** *** Busu Busu. I hope you know why I chose stars instead of words.

Cheers to our first Valentine’s Day—and many more to come. ♾️💕`;

let i=0;
function startTyping(){
  const el=document.getElementById("text");
  const cursor='<span class="cursor"></span>';
  if(i<letterText.length){
    el.innerHTML = letterText.slice(0,i+1) + cursor;
    i++;
    setTimeout(startTyping,40);
  } else {
    el.innerHTML = letterText;
  }
}

/* TIMER */
const metDate=new Date("2025-11-13T11:00:00");

function updateTimer(){
  const now=new Date();
  const diff=now-metDate;
  const d=Math.floor(diff/(1000*60*60*24));
  const h=Math.floor(diff/(1000*60*60)%24);
  const m=Math.floor(diff/(1000*60)%60);
  timer.innerText=`Time since we met: ${d} days, ${h} hours, ${m} minutes ♾️`;
}
setInterval(updateTimer,1000);
updateTimer();
</script>

</body>
</html>
