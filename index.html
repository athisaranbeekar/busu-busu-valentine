<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Busu Busu 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:'Caveat',cursive;
  color:#4a0e2e;
  overflow:hidden;
}

/* FLOATING HEARTS */
.hearts span{
  position:fixed;
  bottom:-50px;
  font-size:22px;
  animation:float 12s linear infinite;
  opacity:0.7;
  z-index:0;
}

@keyframes float{
  0%{transform:translateY(0);opacity:0;}
  10%{opacity:0.8;}
  100%{transform:translateY(-110vh);opacity:0;}
}

.page{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  position:relative;
  z-index:1;
}

.card{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px);
  padding:40px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(255,0,120,0.35);
}

h1{
  font-family:'Pacifico',cursive;
  font-size:3rem;
  margin-bottom:20px;
}

.question{
  font-size:1.6rem;
  margin-bottom:30px;
}

.btns{
  position:relative;
  height:120px;
}

button{
  padding:12px 32px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  font-size:1.1rem;
  cursor:pointer;
  position:absolute;
}

#yes{left:30%;}
#no{left:55%;}

/* PASSWORD PAGE */
#passwordPage{
  display:none;
  flex-direction:column;
}

input{
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:1.1rem;
  text-align:center;
}

/* LETTER PAGE */
#letterPage{
  display:none;
  height:100vh;
  overflow-y:auto;
  padding:60px 20px;
}

.letter{
  max-width:720px;
  margin:auto;
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(16px);
  padding:50px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(255,0,120,0.35);
}

.letter h2{
  font-family:'Pacifico',cursive;
  font-size:2.6rem;
  margin-bottom:25px;
}

.handwritten{
  font-size:1.6rem;
  line-height:2.2;
  letter-spacing:0.3px;
  white-space:pre-wrap;
}

.cursor{
  display:inline-block;
  width:3px;
  height:1.6rem;
  background:#4a0e2e;
  margin-left:4px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

.timer{
  margin-bottom:25px;
  font-size:1.1rem;
  font-style:italic;
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2f6c0f6a9b.mp3" type="audio/mpeg">
</audio>

<!-- HEARTS -->
<div class="hearts">
  <span style="left:5%">💖</span>
  <span style="left:15%">💗</span>
  <span style="left:25%">💓</span>
  <span style="left:35%">💞</span>
  <span style="left:45%">💝</span>
  <span style="left:55%">❤️</span>
  <span style="left:65%">💘</span>
  <span style="left:75%">💖</span>
  <span style="left:85%">💗</span>
  <span style="left:95%">💓</span>
</div>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <div class="card">
    <h1>Hey Busu Busu 💕</h1>
    <div class="question">Will you be my Valentine forever ♾️?</div>
    <div class="btns">
      <button id="yes">YES 💖</button>
      <button id="no">NO 🙈</button>
    </div>
  </div>
</div>

<!-- PASSWORD -->
<div class="page" id="passwordPage">
  <div class="card">
    <h1>Only for you 💗</h1>
    <p>The Date I turned you on and felt your soft Busu Busu</p>
    <input type="password" id="password">
    <br><br>
    <button onclick="checkPassword()">Unlock 💌</button>
  </div>
</div>

<!-- LETTER -->
<div id="letterPage">
  <div class="letter">
    <h2>Busu Busu 💖</h2>
    <div class="timer" id="timer"></div>
    <div class="handwritten" id="text"></div>
  </div>
</div>

<script>
const bgMusic=document.getElementById("bgMusic");

/* RUNAWAY NO */
const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseenter",()=>{
  noBtn.style.left=Math.random()*70+"%";
  noBtn.style.top=Math.random()*70+"%";
});

/* YES CLICK */
yes.onclick=()=>{
  bgMusic.volume=0;
  bgMusic.play();
  let v=0;
  const fade=setInterval(()=>{
    if(v<0.5){ v+=0.02; bgMusic.volume=v; }
    else clearInterval(fade);
  },200);

  page1.style.display="none";
  passwordPage.style.display="flex";
};

/* PASSWORD */
const SECRET="26012026";
function checkPassword(){
  if(password.value===SECRET){
    passwordPage.style.display="none";
    letterPage.style.display="block";
    startTyping();
  } else alert("Try again 💕");
}

/* TYPING EFFECT (SLOWED) */
const letterText = `YOUR LETTER TEXT HERE`; // keep same text
let i=0;

function startTyping(){
  const el=document.getElementById("text");
  const cursor='<span class="cursor"></span>';
  if(i<letterText.length){
    el.innerHTML=letterText.slice(0,i+1)+cursor;
    i++;
    setTimeout(startTyping,80); // ⬅ slower & romantic
  } else el.innerHTML=letterText;
}

/* TIMER */
const metDate=new Date("2025-11-13T11:00:00");
function updateTimer(){
  const diff=new Date()-metDate;
  timer.innerText=`Time since we met: ${Math.floor(diff/86400000)} days ♾️`;
}
setInterval(updateTimer,1000);
updateTimer();
</script>

</body>
</html>
